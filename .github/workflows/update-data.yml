name: Update macro data

on:
  schedule:
    - cron: "0 0 * * *"   # 00:00 UTC = ~7h sang gio Viet Nam, chay hang ngay
  workflow_dispatch: {}    # cho phep bam "Run workflow" chay tay tren GitHub

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch du lieu (FRED + World Bank + ForexFactory)
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python src/update_data.py

      - name: Commit va push data/macro.db neu co thay doi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/macro.db
          git diff --cached --quiet || git commit -m "chore: update macro data"
          git push
